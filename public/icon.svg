<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe6f2" />
      <stop offset="60%" stop-color="#f0e6ff" />
      <stop offset="100%" stop-color="#e1f5fe" />
    </radialGradient>
    <linearGradient id="frogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5df095" />
      <stop offset="100%" stop-color="#128c46" />
    </linearGradient>
    <linearGradient id="candyGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lollipopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5b99" />
      <stop offset="50%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4a2820" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Bubble -->
  <rect width="512" height="512" rx="140" fill="url(#skyGrad)" />
  <rect width="512" height="512" rx="140" fill="none" stroke="#ffffff" stroke-width="16" />

  <!-- Cute Frog Body with Candy Match Aesthetics -->
  <g filter="url(#shadow)">
    <!-- Frog Feet -->
    <ellipse cx="160" cy="400" rx="46" ry="26" fill="#128c46" />
    <ellipse cx="352" cy="400" rx="46" ry="26" fill="#128c46" />

    <!-- Frog Big Eyes Tops -->
    <circle cx="170" cy="180" r="68" fill="url(#frogGrad)" stroke="#ffffff" stroke-width="8" />
    <circle cx="342" cy="180" r="68" fill="url(#frogGrad)" stroke="#ffffff" stroke-width="8" />

    <!-- Frog Main Body -->
    <ellipse cx="256" cy="300" rx="160" ry="130" fill="url(#frogGrad)" stroke="#ffffff" stroke-width="10" />

    <!-- Belly Candy Spot -->
    <ellipse cx="256" cy="330" rx="100" ry="75" fill="#ffe566" />
    <ellipse cx="256" cy="330" rx="94" ry="70" fill="#fffaf0" />

    <!-- Frog Eyes Pupils -->
    <circle cx="180" cy="175" r="40" fill="#ffffff" />
    <circle cx="188" cy="172" r="24" fill="#4a2820" />
    <circle cx="178" cy="162" r="9" fill="#ffffff" />

    <circle cx="332" cy="175" r="40" fill="#ffffff" />
    <circle cx="324" cy="172" r="24" fill="#4a2820" />
    <circle cx="334" cy="162" r="9" fill="#ffffff" />

    <!-- Cheerful Big Smile -->
    <path d="M 190 280 Q 256 345 322 280" fill="none" stroke="#4a2820" stroke-width="10" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="160" cy="285" r="18" fill="#ff5b99" opacity="0.6" />
    <circle cx="352" cy="285" r="18" fill="#ff5b99" opacity="0.6" />

    <!-- Glossy Highlight across forehead -->
    <path d="M 150 220 Q 256 190 362 220" fill="none" stroke="url(#candyGloss)" stroke-width="18" stroke-linecap="round" />

    <!-- Little Candy Crown / Bow -->
    <path d="M 226 100 L 256 125 L 286 100 L 280 145 L 232 145 Z" fill="#ffd000" stroke="#ffffff" stroke-width="4" />
    <circle cx="256" cy="108" r="8" fill="#ff3b4e" />
  </g>
</svg>
